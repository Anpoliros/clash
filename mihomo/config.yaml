port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
external-ui: ./ui
secret: '890890'
tun:
  enable: false
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  # exclude-uid:
    # - 996
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
  fallback:
    - 1.1.1.1
    - 8.8.8.8
sniffer:
  enable: true
  sniffing:
    - tls
    - http
p:
  type: http
  interval: 3600
  health-check:
    enable: true
    url: https://cp.cloudflare.com
    interval: 300
    timeout: 1000
    tolerance: 100
use:
  type: url-test
  use:
proxy-providers:
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 全部节点
    use: []  - type: url-test
    use:
    name: 自动选择
  - name: 全部节点
    type: select
    use:
rules:
  - DOMAIN-SUFFIX,google.com,节点选择
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
