#   # 例如 [WARP, 全部节点, 自动选择, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, DIRECT],
#   - {
#       name: 节点选择,
#       type: select,
#       proxies:
#         [全部节点],
#     }
#   - { name: 全部节点, <<: *use }


# region proxy-groups
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 全部节点

  - name: 自动选择
    <<: *use

  - name: 全部节点
    type: select
    use:
      # - ladder


# region rules
rules:
  - DOMAIN-SUFFIX,google.com,节点选择
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
